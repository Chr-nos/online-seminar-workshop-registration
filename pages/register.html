<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create account — Congistry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <canvas id="particle-bg"></canvas>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark"></div>
      <span class="brand-name">Congistry</span>
    </div>

    <div class="auth-title">Create account</div>
    <div class="auth-sub">Register to browse and join seminars and workshops.</div>
    <div class="auth-sub" style="margin-top:-14px;">Organizer and admin accounts are set up separately.</div>

    <div class="auth-error" id="error-box"></div>

    <form class="auth-form" id="register-form">
      <div class="field">
        <label class="field-label" for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <button class="btn primary" type="submit" id="submit-btn">Create account</button>
    </form>

    <div class="auth-footer">
      <a href="../public/index.html" class="auth-link">← Back to menu</a>
      <br>
      Already have an account? <a href="login.html" class="auth-link">Log in</a>
    </div>
  </div>
</div>

<script src="../assets/js/effects/particles.js"></script>
<script type="module" src="../assets/js/register.js"></script>
</body>
</html>

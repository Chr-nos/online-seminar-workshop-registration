<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Organizer — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <span class="brand-name">Congistry</span>
        <span class="brand-sub">organizer portal</span>
      </div>
    </div>

    <nav>
      <div class="nav-label">Organizer</div>
      <div class="nav-item active" id="nav-attendance">
        <span>Attendance</span>
      </div>
      <div class="nav-item" id="nav-events">
        <span>Events</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="avatar" id="footer-avatar">--</div>
      <div>
        <div class="user-name" id="footer-name">Loading…</div>
        <div class="user-role">organizer</div>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1>Organizer control</h1>
        <div class="breadcrumb">organizer / attendance</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn" id="logout-btn" type="button">Log out</button>
        <div class="timestamp" id="clock"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Registered</div>
        <div class="stat-value" id="registered-count">0</div>
        <div class="stat-delta up">Participants</div>
      </div>
      <div class="stat">
        <div class="stat-label">Checked in</div>
        <div class="stat-value" id="checked-in-count">0</div>
        <div class="stat-delta">Today</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pending-count">0</div>
        <div class="stat-delta warn">Need attention</div>
      </div>
      <div class="stat">
        <div class="stat-label">Events</div>
        <div class="stat-value" id="events-count">0</div>
        <div class="stat-delta up">Managed</div>
      </div>
    </div>

    <div id="attendance-view">
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Attendance overview</span>
        </div>
        <div id="attendance-summary" class="panel-body">
          <div class="empty-row">Select an event to review attendee status.</div>
        </div>
      </div>
    </div>

    <div id="events-view" hidden>
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Managed events</span>
        </div>
        <div id="event-list" class="panel-body"></div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="../assets/js/organizer-dashboard.js"></script>
</body>
</html>
